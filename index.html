<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My GitHub Skyline</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(180deg, #0f0f0f, #1a1a1a);
      }
      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }
    </style>
  </head>
  <body>
    <model-viewer src="skyline.glb" 
                  alt="GitHub Skyline"
                  auto-rotate
                  camera-controls
                  exposure="1"
                  shadow-intensity="2.5"
                  shadow-softness="0.1"
                  shadow-field-of-view="40deg">
    </model-viewer>
  </body>
</html>
